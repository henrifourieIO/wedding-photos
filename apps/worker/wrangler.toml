name = "wedding-photos"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "wedding-photos"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-photos"

[[kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[queues.producers]]
binding = "PHOTO_QUEUE"
queue = "photo-uploaded"

[[queues.consumers]]
queue = "photo-uploaded"
max_batch_size = 10
max_batch_timeout = 5

[durable_objects]
bindings = [{ name = "EVENT_ROOM", class_name = "EventRoom" }]

[[migrations]]
tag = "v1"
new_classes = ["EventRoom"]

[env.staging]
name = "wedding-photos-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "wedding-photos-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-photos-staging"

[[env.staging.kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"

[[env.staging.queues.producers]]
binding = "PHOTO_QUEUE"
queue = "photo-uploaded-staging"

[[env.staging.queues.consumers]]
queue = "photo-uploaded-staging"
max_batch_size = 10
max_batch_timeout = 5

[env.staging.durable_objects]
bindings = [{ name = "EVENT_ROOM", class_name = "EventRoom" }]

[[env.staging.migrations]]
tag = "v1"
new_classes = ["EventRoom"]

[env.production]
name = "wedding-photos"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "wedding-photos"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-photos"

[[env.production.kv_namespaces]]
binding = "LINKS"
id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID"

[[env.production.queues.producers]]
binding = "PHOTO_QUEUE"
queue = "photo-uploaded"

[[env.production.queues.consumers]]
queue = "photo-uploaded"
max_batch_size = 10
max_batch_timeout = 5

[env.production.durable_objects]
bindings = [{ name = "EVENT_ROOM", class_name = "EventRoom" }]

[[env.production.migrations]]
tag = "v1"
new_classes = ["EventRoom"]
