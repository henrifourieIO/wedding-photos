name = "wedding-photos"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

[vars]
DEV_BYPASS_ACCESS = "true"
R2_BUCKET_NAME = "wedding-photos"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "wedding-photos"
database_id = "b4d5fb39-4bf6-423a-b6c7-518efe5ee807"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-photos"

[[kv_namespaces]]
binding = "LINKS"
id = "c639e02978b54cb38c3767704fbb2059"

[[queues.producers]]
binding = "PHOTO_QUEUE"
queue = "photo-uploaded"

[[queues.consumers]]
queue = "photo-uploaded"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "photo-uploaded-dlq"

[durable_objects]
bindings = [{ name = "EVENT_ROOM", class_name = "EventRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventRoom"]

[env.staging]
name = "wedding-photos-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
R2_BUCKET_NAME = "wedding-photos-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "wedding-photos-staging"
database_id = "aa76696f-7c3a-4dfd-a5ea-05ef646a35dc"

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-photos-staging"

[[env.staging.kv_namespaces]]
binding = "LINKS"
id = "7a0b645a0acf4a3e80a06de0a492f88b"

[[env.staging.queues.producers]]
binding = "PHOTO_QUEUE"
queue = "photo-uploaded-staging"

[[env.staging.queues.consumers]]
queue = "photo-uploaded-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "photo-uploaded-staging-dlq"

[env.staging.durable_objects]
bindings = [{ name = "EVENT_ROOM", class_name = "EventRoom" }]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["EventRoom"]

[env.production]
name = "wedding-photos"

[env.production.vars]
ENVIRONMENT = "production"
R2_BUCKET_NAME = "wedding-photos"
# Host auth: set HOST_PASSWORD (secret; optional HOST_SESSION_SECRET). Optional Access JWT:
# (set in dashboard or CLI — do not commit real values):
# CF_ACCESS_TEAM_DOMAIN — Zero Trust → Settings → Custom pages (team domain)
# CF_ACCESS_AUD — Access → Applications → app → Application Audience (AUD) Tag
# Workers & Pages → wedding-photos → Settings → Variables and Secrets → Production

[[env.production.d1_databases]]
binding = "DB"
database_name = "wedding-photos"
database_id = "b4d5fb39-4bf6-423a-b6c7-518efe5ee807"

[[env.production.r2_buckets]]
binding = "PHOTOS"
bucket_name = "wedding-photos"

[[env.production.kv_namespaces]]
binding = "LINKS"
id = "c639e02978b54cb38c3767704fbb2059"

[[env.production.queues.producers]]
binding = "PHOTO_QUEUE"
queue = "photo-uploaded"

[[env.production.queues.consumers]]
queue = "photo-uploaded"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "photo-uploaded-dlq"

[env.production.durable_objects]
bindings = [{ name = "EVENT_ROOM", class_name = "EventRoom" }]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["EventRoom"]
